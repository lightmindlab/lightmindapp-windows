name: Build Windows Installer

# 触发条件：
# 1. 推送到 main 分支（CI 验证构建是否正常，产物作为 artifact 上传）
# 2. 推送 v* 开头的 tag（构建并发布到 GitHub Releases）
# 3. 手动触发（workflow_dispatch）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 避免同分支重复构建抢占资源
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LightMind (Windows NSIS)
    # 使用 Windows runner 原生构建，避免 Linux + wine 的兼容性问题
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Provision rcedit
        # package.json 中 signAndEditExecutable=false，electron-builder 不会自动下载
        # winCodeSign，但自定义 afterPack 钩子需要 rcedit-x64.exe 来注入图标与版本信息，
        # 故从 winCodeSign-2.6.0 中提取 rcedit-x64.exe 并通过 RCEDIT_PATH 注入给钩子。
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:GITHUB_WORKSPACE "tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          $url = "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\wcs.7z"
          & 7z e -y "-o$toolsDir" "$env:TEMP\wcs.7z" rcedit-x64.exe | Out-Null
          Get-Item (Join-Path $toolsDir "rcedit-x64.exe")

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build Windows NSIS installer
        run: npm run dist:nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RCEDIT_PATH: ${{ github.workspace }}/tools/rcedit-x64.exe

      - name: List build output
        shell: bash
        run: ls -lh dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightMind-${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LightMind-${{ steps.version.outputs.version }}-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LightMind ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest*.yml
