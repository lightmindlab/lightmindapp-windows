name: Build Windows Installer

# 触发条件：
# 1. 推送到 main 分支（CI 验证构建是否正常，产物作为 artifact 上传）
# 2. 推送 v* 开头的 tag（构建并发布到 GitHub Releases）
# 3. 手动触发（workflow_dispatch），可选是否发布 Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布为 GitHub Release（需先打 tag；仅打 tag 时此项生效）'
        required: false
        default: 'false'

# 避免同分支重复构建抢占资源
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LightMind (Windows NSIS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Wine64
        # rcedit-x64.exe 是 64 位 Windows 程序，仅需 64 位 wine。
        # 注意 Ubuntu 24.04 (noble) 的 wine64 包不把 wine64 放入 PATH，
        # 二进制实际位于 /usr/lib/wine/wine64。但 electron-builder 的
        # app-builder-bin 依赖 PATH 上的 `wine` 命令，故建立符号链接。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 p7zip-full
          /usr/lib/wine/wine64 --version
          sudo ln -sf /usr/lib/wine/wine64 /usr/local/bin/wine
          sudo ln -sf /usr/lib/wine/wine64 /usr/local/bin/wine64
          wine --version

      - name: Initialize Wine prefix
        # 预先初始化 wineprefix 并禁用 mono/gecko 下载提示，
        # 避免首次运行 rcedit 时卡在 GUI 弹窗。
        run: |
          WINEPREFIX="$HOME/.wine64" WINEDLLOVERRIDES="mscoree,mshtml=" \
            wine wineboot --init
          echo "Wine prefix ready at $HOME/.wine64"

      - name: Provision winCodeSign (rcedit)
        # package.json 中 signAndEditExecutable=false，electron-builder 不会自动下载
        # winCodeSign；但自定义 afterPack 钩子需要其中的 rcedit-x64.exe 来注入图标与
        # 版本信息，故手动下载并解压到 electron-builder 缓存目录。
        run: |
          CACHE="$HOME/.cache/electron-builder/winCodeSign"
          mkdir -p "$CACHE"
          curl -fL -o /tmp/wcs.7z \
            "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z"
          7z x -y -o"$CACHE" /tmp/wcs.7z >/dev/null
          ls -la "$CACHE/winCodeSign-2.6.0/rcedit-x64.exe"

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build Windows NSIS installer
        run: npm run dist:nsis
        env:
          # GitHub Actions runner 不缓存 electron-builder 的 winCodeSign，
          # 允许其联网下载 rcedit-x64.exe 等工具
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 复用上一步初始化好的 wineprefix；禁用 mono/gecko 提示
          WINEPREFIX: /home/runner/.wine64
          WINEDLLOVERRIDES: mscoree,mshtml=

      - name: List build output
        run: ls -lh dist/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightMind-${{ steps.version.outputs.version }}-win-x64
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: LightMind-${{ steps.version.outputs.version }}-win-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LightMind ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest*.yml
