<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'unsafe-inline'">
  <title>LightMind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .chick {
      width: 144px;
      height: 144px;
      image-rendering: -webkit-optimize-contrast;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .tip {
      margin-top: 28px;
      color: #5f6368;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 1px;
    }
    /* 加载点动画（Chromium 支持 content 动画） */
    .dot::after {
      content: "";
      display: inline-block;
      width: 1.5em;
      text-align: left;
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="chick" src="./hatching_chick_animated.png" alt="">
    <div class="tip">正在加载<span class="dot"></span></div>
  </div>
</body>
</html>
